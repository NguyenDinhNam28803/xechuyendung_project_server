openapi: 3.1.0
info:
  title: Xe Chuyên Dụng API
  version: 1.3.0
  description: Public content, admin CMS, activity history, and contact intake API.
servers:
  - url: http://localhost:4000
    description: Local development
# Mặc định công khai; endpoint quản trị khai báo AdminBearer ở từng operation.
security: []
tags:
  - name: Health
  - name: Authentication
  - name: Public content
  - name: Admin content
  - name: Contact submissions
  - name: Admin users
  - name: Two-factor authentication
  - name: Admin dashboard
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      tags: [Health]
      summary: Database readiness
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  checks:
                    type: object
                    properties:
                      database: { type: string, const: ok }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Exchange admin credentials for a revocable session token
      description: >
        At most 20 requests per IP per 15 minutes. Only failed attempts are
        counted for lockout: 5 failures per (IP, username) per 15 minutes and
        50 failures per username across all IPs per hour; a successful login
        clears the (IP, username) counter, so an attacker cannot lock the owner
        out from a different IP. Blocked requests get 429 with Retry-After.
        Unknown users, wrong passwords and disabled accounts all return the
        same 401 message. When the account has two-factor authentication
        enabled, no session is created: the response carries a 5-minute
        challengeToken to send to /api/v1/auth/login/verify with the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Password accepted; either a session or a 2FA challenge.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSession"
                  - $ref: "#/components/schemas/TwoFactorChallenge"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/login/verify:
    post:
      tags: [Authentication]
      summary: Complete a login with a TOTP code or a one-time recovery code
      description: >
        Send exactly one of code (6 digits) or recoveryCode. A challenge
        allows at most 5 attempts and expires after 5 minutes. Wrong codes
        count towards the same (IP, username) and per-username failure limits
        as wrong passwords. A TOTP code that was already used is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken]
              additionalProperties: false
              properties:
                challengeToken: { type: string }
                code: { type: string, pattern: "^[0-9 ]{6,7}$" }
                recoveryCode: { type: string, description: "XXXX-XXXX-XXXX-XXXX; dashes and case are ignored." }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/LoginSession"
                  - type: object
                    properties:
                      recoveryCodesRemaining:
                        type: integer
                        description: Present only when a recovery code was used.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/account/2fa:
    get:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Two-factor status of the current account
      description: Allowed while the session is restricted for missing 2FA enrollment.
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, enabledAt, required, recoveryCodesRemaining]
                properties:
                  enabled: { type: boolean }
                  enabledAt: { type: [string, "null"], format: date-time }
                  required: { type: boolean, description: True when the account's role must use 2FA. }
                  recoveryCodesRemaining: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/account/2fa/setup:
    post:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Start enrollment and get the secret to add to an authenticator app
      description: >
        Creates a pending secret valid for 15 minutes. The client renders the
        otpauthUri as a QR code. Allowed while the session is restricted.
      responses:
        "200":
          description: Pending secret.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri, expiresIn]
                properties:
                  secret: { type: string, description: Base32 secret for manual entry. }
                  otpauthUri: { type: string }
                  expiresIn: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/admin/account/2fa/confirm:
    post:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Confirm enrollment with a code from the app
      description: >
        Enables 2FA, returns 10 recovery codes (shown only this once) and
        revokes every other session of the account; the current session is
        kept. Allowed while the session is restricted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "200":
          description: 2FA enabled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, recoveryCodes]
                properties:
                  enabled: { type: boolean, const: true }
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/account/2fa/disable:
    post:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Turn 2FA off (only when the role does not require it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, format: password }
                code: { type: string }
      responses:
        "200": { description: 2FA disabled. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/account/2fa/recovery-codes:
    post:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Replace the recovery codes (old codes stop working)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "200":
          description: New recovery codes.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/admin/users/{id}/2fa/reset:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Two-factor authentication]
      security: [{ AdminBearer: [] }]
      summary: Reset another account's 2FA (role admin, own 2FA enabled)
      description: >
        Clears the secret and recovery codes and revokes every session of the
        account; it must enroll again at its next login. Not allowed on the
        caller's own account.
      responses:
        "200":
          description: Reset done.
          content:
            application/json:
              schema:
                type: object
                required: [reset, sessionsRevoked]
                properties:
                  reset: { type: boolean, const: true }
                  sessionsRevoked: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{ AdminBearer: [] }]
      summary: Revoke the current session
      responses:
        "200": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      security: [{ AdminBearer: [] }]
      summary: Current admin identity, role and 2FA state
      description: Allowed while the session is restricted for missing 2FA enrollment.
      responses:
        "200":
          description: Authenticated admin.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminIdentity"
                  - type: object
                    required: [twoFactorSetupRequired]
                    properties:
                      twoFactorSetupRequired: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/account/password:
    post:
      tags: [Authentication]
      security: [{ AdminBearer: [] }]
      summary: Change the current admin's password and sign out other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
      responses:
        "200": { description: Password changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/users:
    get:
      tags: [Admin users]
      security: [{ AdminBearer: [] }]
      summary: List admin accounts (role admin only)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: sort
          in: query
          description: "Sort as field:asc|desc. Fields: username, displayName, role, isActive, lastLoginAt, createdAt."
          schema: { type: string, pattern: "^(username|displayName|role|isActive|lastLoginAt|createdAt)(:(asc|desc))?$" }
      responses:
        "200":
          description: A page of admin accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin users]
      security: [{ AdminBearer: [] }]
      summary: Create an admin account (role admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInput" }
      responses:
        "201":
          description: Created account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin users]
      security: [{ AdminBearer: [] }]
      summary: Update, disable or reset the password of an account (role admin only)
      description: >
        Changing the role, disabling the account or resetting the password
        revokes every open session of that account. An admin cannot change
        their own role or disable themselves, and at least one active admin
        must remain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserPatch" }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/vehicles:
    get:
      tags: [Public content]
      summary: List published vehicles
      description: >
        Without page/limit the response is the full array (backward
        compatible). With page or limit it is a page envelope (default 12).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicLimit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Published vehicles.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/PublicVehicle" }
                  - $ref: "#/components/schemas/PublicVehiclePage"
  /api/v1/vehicles/{slug}:
    get:
      tags: [Public content]
      summary: Get a published vehicle by slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published vehicle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicVehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/articles:
    get:
      tags: [Public content]
      summary: List published articles
      description: Same pagination contract as /api/v1/vehicles.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PublicLimit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Published articles.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/PublicArticle" }
                  - $ref: "#/components/schemas/PublicArticlePage"
  /api/v1/articles/{slug}:
    get:
      tags: [Public content]
      summary: Get a published article by slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicArticle" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/legal-resources:
    get:
      tags: [Public content]
      summary: List published legal resources
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [policy, regulation, legal_guide]
      responses:
        "200":
          description: Published legal resources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicLegalResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/contact-submissions:
    post:
      tags: [Contact submissions]
      summary: Submit a contact request
      description: Requires explicit consent; honeypot field should be empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSubmissionInput" }
      responses:
        "201":
          description: Submission accepted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean, const: true }
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/admin/vehicles:
    get:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: List vehicles including drafts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Published"
        - name: sort
          in: query
          description: "Sort as field:asc|desc. Fields: name, make, category, isPublished, createdAt, updatedAt."
          schema: { type: string, pattern: "^(name|make|category|isPublished|createdAt|updatedAt)(:(asc|desc))?$" }
      responses:
        "200":
          description: A page of vehicles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/vehicles/bulk:
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Publish, unpublish or delete several vehicles in one transaction
      description: >
        Unknown ids are ignored. Only rows that actually change are audited
        (one activity entry per row); `affected` reports how many changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: Bulk result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Partially update a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiclePatch" }
      responses:
        "200": { description: Updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Delete a vehicle
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/articles:
    get:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: List articles including drafts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Published"
        - name: sort
          in: query
          description: "Sort as field:asc|desc. Fields: title, category, isPublished, createdAt, updatedAt."
          schema: { type: string, pattern: "^(title|category|isPublished|createdAt|updatedAt)(:(asc|desc))?$" }
      responses:
        "200":
          description: A page of articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticlePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Create an article
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/articles/bulk:
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Publish, unpublish or delete several articles in one transaction
      description: >
        Unknown ids are ignored. Only rows that actually change are audited
        (one activity entry per row); `affected` reports how many changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: Bulk result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/articles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Partially update an article
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticlePatch" }
      responses:
        "200": { description: Updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Delete an article
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/import-defaults:
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Import missing sample vehicles and articles as drafts
      description: >
        Skips existing slugs and never overwrites. Imported records are always
        stored with isPublished=false regardless of the payload; at most 200
        items per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicles, articles]
              properties:
                vehicles:
                  type: array
                  items: { $ref: "#/components/schemas/VehicleInput" }
                articles:
                  type: array
                  items: { $ref: "#/components/schemas/ArticleInput" }
      responses:
        "201": { description: Imported missing records. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/legal-resources:
    get:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: List legal resources including drafts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Published"
        - name: type
          in: query
          schema:
            type: string
            enum: [policy, regulation, legal_guide]
        - name: sort
          in: query
          description: "Sort as field:asc|desc. Fields: title, resourceType, isPublished, createdAt, updatedAt."
          schema: { type: string, pattern: "^(title|resourceType|isPublished|createdAt|updatedAt)(:(asc|desc))?$" }
      responses:
        "200":
          description: A page of legal resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalResourcePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Create a legal resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalResourceInput" }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/legal-resources/bulk:
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Publish, unpublish or delete several legal resources in one transaction
      description: >
        Unknown ids are ignored. Only rows that actually change are audited
        (one activity entry per row); `affected` reports how many changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: Bulk result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/legal-resources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Partially update a legal resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalResourcePatch" }
      responses:
        "200": { description: Updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Delete a legal resource
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/activity:
    get:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: List recent activity
      description: >
        Optional filters by action, entity type and an inclusive date range
        (`from`/`to`, YYYY-MM-DD in the Asia/Ho_Chi_Minh calendar).
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - $ref: "#/components/parameters/Search"
        - name: action
          in: query
          schema: { $ref: "#/components/schemas/ActivityAction" }
        - name: entityType
          in: query
          schema: { $ref: "#/components/schemas/ActivityEntityType" }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of recent events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/contact-submissions:
    get:
      tags: [Contact submissions]
      security: [{ AdminBearer: [] }]
      summary: List recent contact requests
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of contact submissions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSubmissionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/contact-submissions/search:
    post:
      tags: [Contact submissions]
      security: [{ AdminBearer: [] }]
      summary: Search contact requests without putting personal data in the URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSubmissionSearch" }
      responses:
        "200":
          description: A page of matching contact submissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSubmissionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/contact-submissions/{id}/status:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Contact submissions]
      security: [{ AdminBearer: [] }]
      summary: Update the contact request lifecycle status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, in_progress, contacted, closed, spam]
      responses:
        "200": { description: Status updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/contact-submissions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Contact submissions]
      security: [{ AdminBearer: [] }]
      summary: Permanently delete a contact request
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Admin users]
      security: [{ AdminBearer: [] }]
      summary: List active sessions (devices) of an account (role admin only)
      responses:
        "200":
          description: Active sessions, most recently used first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/users/{id}/sessions/revoke:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin users]
      security: [{ AdminBearer: [] }]
      summary: Sign an account out of every device (role admin only)
      description: When applied to yourself the current session is kept.
      responses:
        "200":
          description: Number of revoked sessions.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/account/sessions:
    get:
      tags: [Authentication]
      security: [{ AdminBearer: [] }]
      summary: List the current admin's active sessions
      responses:
        "200":
          description: Active sessions; `current` marks this session.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/account/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Authentication]
      security: [{ AdminBearer: [] }]
      summary: Sign out one of your other devices
      responses:
        "200": { description: Session revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/stats/overview:
    get:
      tags: [Admin dashboard]
      security: [{ AdminBearer: [] }]
      summary: All dashboard counters in one request
      responses:
        "200":
          description: Dashboard counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/stats/contacts:
    get:
      tags: [Admin dashboard]
      security: [{ AdminBearer: [] }]
      summary: Contact request trend for the last N days
      description: >
        Days are counted in Asia/Ho_Chi_Minh. Includes archived daily counts so
        trends outlive the 90-day retention of individual requests.
      parameters:
        - $ref: "#/components/parameters/StatsDays"
      responses:
        "200":
          description: Contact statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/stats/activity:
    get:
      tags: [Admin dashboard]
      security: [{ AdminBearer: [] }]
      summary: Admin activity for the last N days
      parameters:
        - $ref: "#/components/parameters/StatsDays"
      responses:
        "200":
          description: Activity statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/vehicle-categories:
    get:
      tags: [Public content]
      summary: List vehicle categories in display order
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, description]
                  properties:
                    name: { type: string }
                    description: { type: string }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/admin/vehicle-categories:
    get:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: List vehicle categories with usage counts
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: A page of categories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleCategoryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Create a vehicle category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleCategoryInput" }
      responses:
        "201":
          description: Created category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/vehicle-categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Update a category; renaming also renames it on every vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleCategoryPatch" }
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleCategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Admin content]
      security: [{ AdminBearer: [] }]
      summary: Delete an unused category (409 while vehicles still use it)
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque session token (revocable, 8 hours)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, maxLength: 120 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PublicLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
    Search:
      name: q
      in: query
      description: Case-insensitive substring; "%" and "_" are matched literally.
      schema: { type: string, maxLength: 100 }
    StatsDays:
      name: days
      in: query
      description: Number of days including today.
      schema: { type: integer, minimum: 7, maximum: 365, default: 30 }
    Published:
      name: published
      in: query
      description: true = only published items, false = only drafts, omitted = all.
      schema: { type: string, enum: ["true", "false"] }
  schemas:
    AdminRole:
      type: string
      enum: [admin, editor]
      description: admin manages accounts; editor manages content and contacts.
    AdminIdentity:
      type: object
      required: [id, username, displayName, role, twoFactorEnabled]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/AdminRole" }
        twoFactorEnabled: { type: boolean }
    LoginSession:
      type: object
      required: [accessToken, expiresIn, twoFactorSetupRequired, user]
      properties:
        accessToken:
          type: string
          description: Opaque random token; the server stores only its SHA-256 hash.
        expiresIn: { type: integer, description: Lifetime in seconds (28800). }
        twoFactorSetupRequired:
          type: boolean
          description: >
            True when the role requires 2FA and the account has not enrolled.
            The session is then restricted: other admin endpoints answer 403
            with code TWO_FACTOR_SETUP_REQUIRED until enrollment is confirmed.
        user: { $ref: "#/components/schemas/AdminIdentity" }
    TwoFactorChallenge:
      type: object
      required: [mfaRequired, challengeToken, expiresIn]
      properties:
        mfaRequired: { type: boolean, const: true }
        challengeToken: { type: string }
        expiresIn: { type: integer, description: Seconds (300). }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 6-digit TOTP code. }
    RecoveryCodes:
      type: array
      minItems: 10
      maxItems: 10
      items: { type: string, description: "XXXX-XXXX-XXXX-XXXX" }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/AdminIdentity"
        - type: object
          required: [isActive, lastLoginAt, createdAt, updatedAt]
          properties:
            isActive: { type: boolean }
            lastLoginAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AdminUserInput:
      type: object
      required: [username, displayName, password, role]
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-zA-Z0-9._-]{3,60}$" }
        displayName: { type: string, maxLength: 120 }
        password: { type: string, format: password, minLength: 12, maxLength: 200 }
        role: { $ref: "#/components/schemas/AdminRole" }
    AdminUserPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/AdminRole" }
        isActive: { type: boolean }
        password: { type: string, format: password, minLength: 12, maxLength: 200 }
    AdminUserPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    PublicVehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleFields"
      required: [slug, name, make, category, description, artwork, images, badge, useCase, highlights, knownDetails, sourceUrl]
      description: Published vehicle without id or isPublished.
    PublicArticle:
      allOf:
        - $ref: "#/components/schemas/ArticleFields"
      required: [slug, category, title, summary, sections]
      description: Published article without id or isPublished.
    PublicLegalResource:
      type: object
      required: [slug, resourceType, title, summary, content, sourceUrl, updatedAt]
      properties:
        slug: { type: string }
        resourceType: { type: string, enum: [policy, regulation, legal_guide] }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        sourceUrl: { type: [string, "null"], format: uri }
        updatedAt: { type: string, format: date-time }
    PublicVehiclePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicVehicle" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    PublicArticlePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicArticle" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
        - type: object
          required: [id, sourceUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    VehicleFields:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        make: { type: string }
        category: { type: string }
        description: { type: string }
        artwork: { type: string, enum: [cargo, fire, rescue] }
        images: { type: array, items: { type: string } }
        badge: { type: string }
        useCase: { type: string }
        highlights: { type: array, items: { type: string } }
        knownDetails:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        sourceUrl: { type: [string, "null"], format: uri }
        isPublished: { type: boolean }
    VehicleInput:
      allOf:
        - $ref: "#/components/schemas/VehicleFields"
      required:
        - slug
        - name
        - make
        - category
        - description
        - artwork
        - images
        - badge
        - useCase
        - highlights
        - knownDetails
        - isPublished
    VehiclePatch:
      allOf:
        - $ref: "#/components/schemas/VehicleFields"
      minProperties: 1
      description: One or more mutable vehicle fields; id is not accepted.
    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ArticleFields:
      type: object
      properties:
        slug: { type: string }
        category: { type: string }
        title: { type: string }
        summary: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [heading, paragraphs]
            properties:
              heading: { type: string }
              paragraphs: { type: array, items: { type: string } }
        isPublished: { type: boolean }
    ArticleInput:
      allOf:
        - $ref: "#/components/schemas/ArticleFields"
      required: [slug, category, title, summary, sections, isPublished]
    ArticlePatch:
      allOf:
        - $ref: "#/components/schemas/ArticleFields"
      minProperties: 1
      description: One or more mutable article fields; id is not accepted.
    LegalResource:
      allOf:
        - $ref: "#/components/schemas/LegalResourceInput"
        - type: object
          required: [id, sourceUrl, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    LegalResourceFields:
      type: object
      properties:
        slug: { type: string }
        resourceType: { type: string, enum: [policy, regulation, legal_guide] }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        sourceUrl: { type: [string, "null"], format: uri }
        isPublished: { type: boolean }
    LegalResourceInput:
      allOf:
        - $ref: "#/components/schemas/LegalResourceFields"
      required:
        - slug
        - resourceType
        - title
        - summary
        - content
        - isPublished
    LegalResourcePatch:
      allOf:
        - $ref: "#/components/schemas/LegalResourceFields"
      minProperties: 1
      description: One or more mutable resource fields; id is not accepted.
    ContactSubmissionSearch:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        search: { type: string, maxLength: 100 }
        status:
          type: string
          enum: [new, in_progress, contacted, closed, spam]
          description: Only return submissions with this status.
        sort:
          type: string
          pattern: "^(createdAt|name|category|status)(:(asc|desc))?$"
          description: "Sort as field:asc|desc (default createdAt:desc)."
      additionalProperties: false
    ContactSubmissionInput:
      type: object
      required: [name, phone, category, consent]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        category:
          type: string
          enum:
            - Xe tải
            - Xe chữa cháy
            - Xe cứu hộ
            - Xe bồn / xe môi trường
            - Khác / cần tư vấn
        location: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 1000 }
        vehicleSlug: { type: string, maxLength: 120 }
        consent: { type: boolean, const: true }
        companyWebsite:
          type: string
          description: Honeypot field; must be empty.
    ContactSubmission:
      type: object
      required:
        - id
        - name
        - phone
        - category
        - location
        - message
        - vehicleSlug
        - status
        - consentText
        - consentAt
        - firstHandledAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        category: { type: string }
        location: { type: string }
        message: { type: string }
        vehicleSlug: { type: [string, "null"] }
        status:
          type: string
          enum: [new, in_progress, contacted, closed, spam]
        consentText: { type: string }
        consentAt: { type: string, format: date-time }
        firstHandledAt:
          type: [string, "null"]
          format: date-time
          description: When the request first left the "new" status.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PageInfo:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    VehiclePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    ArticlePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Article" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    LegalResourcePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LegalResource" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    ContactSubmissionPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContactSubmission" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    ActivityPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - actor
              - action
              - entityType
              - entityLabel
              - createdAt
            properties:
              id: { type: string, format: uuid }
              actor: { type: string, description: "Username at the time of the action, or system." }
              actorId: { type: [string, "null"], format: uuid }
              action: { $ref: "#/components/schemas/ActivityAction" }
              entityType: { $ref: "#/components/schemas/ActivityEntityType" }
              entityId: { type: [string, "null"], format: uuid }
              entityLabel: { type: string }
              createdAt: { type: string, format: date-time }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string }
        requestId:
          type: string
          description: Matches the X-Request-ID response header; quote it when reporting a problem.
    ActivityAction:
      type: string
      enum: [CREATE, UPDATE, DELETE, IMPORT, LOGIN, LOGOUT]
    ActivityEntityType:
      type: string
      enum:
        - vehicle
        - vehicle_category
        - article
        - policy
        - regulation
        - legal_guide
        - contact_submission
        - admin_user
        - system
    ContactStatusCounts:
      type: object
      required: [new, in_progress, contacted, closed, spam]
      properties:
        new: { type: integer }
        in_progress: { type: integer }
        contacted: { type: integer }
        closed: { type: integer }
        spam: { type: integer }
    ActionCounts:
      type: object
      required: [CREATE, UPDATE, DELETE, IMPORT, LOGIN, LOGOUT]
      properties:
        CREATE: { type: integer }
        UPDATE: { type: integer }
        DELETE: { type: integer }
        IMPORT: { type: integer }
        LOGIN: { type: integer }
        LOGOUT: { type: integer }
    PublishCount:
      type: object
      required: [total, published, draft]
      properties:
        total: { type: integer }
        published: { type: integer }
        draft: { type: integer }
    StatsOverview:
      type: object
      required: [content, contacts, users, generatedAt]
      properties:
        content:
          type: object
          required: [vehicles, articles, legal]
          properties:
            vehicles: { $ref: "#/components/schemas/PublishCount" }
            articles: { $ref: "#/components/schemas/PublishCount" }
            legal:
              type: object
              required: [policy, regulation, legal_guide]
              properties:
                policy: { $ref: "#/components/schemas/PublishCount" }
                regulation: { $ref: "#/components/schemas/PublishCount" }
                legal_guide: { $ref: "#/components/schemas/PublishCount" }
        contacts:
          type: object
          required: [total, byStatus, overdueNew, overdueHours, avgResponseHours, handledLast30Days]
          properties:
            total: { type: integer }
            byStatus: { $ref: "#/components/schemas/ContactStatusCounts" }
            overdueNew: { type: integer, description: "New requests older than overdueHours." }
            overdueHours: { type: integer }
            avgResponseHours: { type: [number, "null"], description: "Last 30 days." }
            handledLast30Days: { type: integer }
        users:
          type: object
          required: [activeUsers, totalUsers, activeSessions]
          properties:
            activeUsers: { type: integer }
            totalUsers: { type: integer }
            activeSessions: { type: integer }
        generatedAt: { type: string, format: date-time }
    ContactStats:
      type: object
      required:
        - days
        - from
        - to
        - total
        - previousTotal
        - changePercent
        - byStatus
        - handledRate
        - avgResponseHours
        - byCategory
        - topVehicles
        - detailRetentionDays
        - series
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: integer }
        previousTotal: { type: integer }
        changePercent: { type: [number, "null"], description: "null when the previous period is empty." }
        byStatus: { $ref: "#/components/schemas/ContactStatusCounts" }
        handledRate: { type: [number, "null"], description: "% of non-spam requests contacted or closed." }
        avgResponseHours: { type: [number, "null"] }
        byCategory:
          type: array
          items:
            type: object
            required: [category, total]
            properties:
              category: { type: string }
              total: { type: integer }
        topVehicles:
          type: array
          items:
            type: object
            required: [slug, name, total]
            properties:
              slug: { type: string }
              name: { type: [string, "null"] }
              total: { type: integer }
        detailRetentionDays: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [day, total, byStatus]
            properties:
              day: { type: string, format: date }
              total: { type: integer }
              byStatus: { $ref: "#/components/schemas/ContactStatusCounts" }
    ActivityStats:
      type: object
      required: [days, from, to, total, byAction, byEntity, topActors, series]
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: integer }
        byAction: { $ref: "#/components/schemas/ActionCounts" }
        byEntity:
          type: array
          items:
            type: object
            required: [entityType, total]
            properties:
              entityType: { $ref: "#/components/schemas/ActivityEntityType" }
              total: { type: integer }
        topActors:
          type: array
          items:
            type: object
            required: [actor, total]
            properties:
              actor: { type: string }
              total: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [day, total, byAction]
            properties:
              day: { type: string, format: date }
              total: { type: integer }
              byAction: { $ref: "#/components/schemas/ActionCounts" }
    BulkRequest:
      type: object
      required: [ids, action]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [publish, unpublish, delete]
    BulkResult:
      type: object
      required: [action, requested, affected]
      properties:
        action: { type: string, enum: [publish, unpublish, delete] }
        requested: { type: integer }
        affected: { type: integer }
    AdminSession:
      type: object
      required: [id, userAgent, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    VehicleCategory:
      type: object
      required: [id, name, description, sortOrder, vehicleCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        vehicleCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleCategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    VehicleCategoryPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    VehicleCategoryPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VehicleCategory" }
        pagination: { $ref: "#/components/schemas/PageInfo" }
  responses:
    BadRequest:
      description: Invalid request data.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid admin authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The authenticated account's role does not allow this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Requested record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A record with the requested slug already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded. Retry after the indicated delay.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeds the allowed size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Required API or database service is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
