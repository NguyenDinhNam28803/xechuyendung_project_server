name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, unit & e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint openapi.yaml

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xe_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d xe_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL chỉ dùng để test xác nhận database đích KHÁC database ứng dụng.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/xe_application
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/xe_app_test
      RUN_POSTGRES_INTEGRATION: "true"
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
